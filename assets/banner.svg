<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="50%" stop-color="#0F1420"/>
      <stop offset="100%" stop-color="#06080D"/>
    </linearGradient>
    
    <!-- Neon Lime Radial Glow -->
    <radialGradient id="neonGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#A6FF5D" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#A6FF5D"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A6FF5D" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#A6FF5D" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif; font-weight: 800; font-size: 58px; fill: url(#titleGrad); letter-spacing: -1.5px; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; font-weight: 400; font-size: 20px; fill: #94A3B8; letter-spacing: 0.2px; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #A6FF5D; letter-spacing: 1.5px; text-transform: uppercase; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Overlay -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- Ambient Glow Center -->
  <ellipse cx="600" cy="140" rx="420" ry="160" fill="url(#neonGlow)"/>

  <!-- Outer Border -->
  <rect x="1.5" y="1.5" width="1197" height="357" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Badge Pill -->
  <g transform="translate(480, 52)">
    <rect width="240" height="30" rx="15" fill="#161F2E" stroke="#A6FF5D" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="18" cy="15" r="4" fill="#A6FF5D"/>
    <text x="32" y="19" class="badge">NEXT-GEN AI STUDIO</text>
  </g>

  <!-- Title & Icon -->
  <g transform="translate(600, 155)" text-anchor="middle">
    <text y="0" class="title">WebCraft ⚡</text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(600, 205)" text-anchor="middle">
    <text y="0" class="tagline">Enterprise-Grade AI Website Generator &amp; Live Customization Sandbox</text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(600, 280)" text-anchor="middle">
    <g transform="translate(-320, 0)">
      <rect x="-100" y="-18" width="200" height="36" rx="18" fill="#111726" stroke="#1E293B" stroke-width="1"/>
      <text y="5" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">⚡ Instant Generation</text>
    </g>
    <g transform="translate(-105, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#111726" stroke="#1E293B" stroke-width="1"/>
      <text y="5" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">📱 Live Multi-Device</text>
    </g>
    <g transform="translate(105, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#111726" stroke="#1E293B" stroke-width="1"/>
      <text y="5" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">💬 AI Conversational Diff</text>
    </g>
    <g transform="translate(315, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#111726" stroke="#1E293B" stroke-width="1"/>
      <text y="5" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">🛡️ Multi-Model Engine</text>
    </g>
  </g>
</svg>
